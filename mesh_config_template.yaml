# A2A Mesh — Node Configuration Template
# Generated by install.sh — edit this file before starting the node
# 
# Usage: python3 cli.py start --name <node_name> --config mesh_config_<node_name>.yaml

mesh:
  node_name: __NODE_NAME__          # e.g. nova, morzsa, runa, lennie
  node_id: ''                       # auto-generated on first run
  transport_priority:
    - p2p                           # P2P over TLS (preferred)
    - pg_notify                      # PostgreSQL NOTIFY (fallback)
    - http                           # HTTP direct (last resort)
  # ─── SSH Tunnel Transport (v0.42.0+) ─────────────────────────
  # Bidirectional SSH tunnels between approved peers. Keys exchange
  # automatically via ssh_key_sync — discovered peers get runtime tunnel
  # entries; static entries optional. advertised_ssh_port = port OUR
  # sshd accepts inbound mesh tunnels on (HAOS embedded sshd: 2222).
  transports:
    ssh_tunnel:
      enabled: true
      default_identity_file: ~/.ssh/id_ed25519_openclaw
      advertised_ssh_port: __SSH_PORT__
      # Embedded sshd manager (auto-enabled in containers/HAOS by node.py):
      # installs openssh-server, listens on sshd_port, self-heals, and peer
      # keys land in the persistent authorized_keys below.
      embedded_sshd: __EMBEDDED_SSHD__
      sshd_port: 2230
      sshd_bind: 0.0.0.0
      sshd_config_dir: __SSHD_CONFIG_DIR__
      # peers:                          # optional static routes, e.g.:
      #   morzsa:
      #     ssh_host: 192.168.1.30
      #     ssh_user: openclaw
      #     ssh_port: 22
      #     remote_port: 8645
  capabilities:
    - a2a_messaging
    - file_transfer
    - p2p_transport
    - pg_transport
    - health_monitor
    - registry
    - dashboard
  skills:
    - id: mesh_send
      name: Send Message
      description: Send a message to another agent or broadcast to all
      tags: [messaging, send]
    - id: mesh_discover
      name: Discover Agents
      description: List all agents in the mesh and their capabilities
      tags: [discovery, agents]
    - id: mesh_health
      name: Health Check
      description: Check the health of mesh nodes
      tags: [health, monitoring]

# ─── Network ────────────────────────────────────────────────────
network:
  host: __NODE_HOST__               # e.g. 192.168.1.50 or Tailscale IP
  p2p_port: 8645
  health_port: 8650
  tls: true                          # mTLS between nodes
  tls_cert: certs/node.crt
  tls_key: certs/node.key
  tls_ca: certs/ca.crt

# ─── PostgreSQL (shared mesh database) ───────────────────────────
postgresql:
  host: __PG_HOST__                 # e.g. 192.168.1.30
  port: 5432
  database: agent_memory
  user: nova
  password: __PG_PASSWORD__
  # Or use DSN: postgresql://user:password@host:5432/agent_memory

# ─── Security ───────────────────────────────────────────────────
security:
  signing_key: ''                   # auto-generated on first run (NaCl signing key)

# ─── Auto-Update ─────────────────────────────────────────────────
auto_update:
  enabled: false
  check_interval: 3600

# ─── Health Monitor ─────────────────────────────────────────────
health_monitor:
  enabled: true
  check_interval: 30                 # seconds between health checks
  timeout: 10                        # health check timeout

# ─── Gateway Watchdog ───────────────────────────────────────────
watchdog:
  enabled: true
  check_interval: 120                # 2 minutes
  restart_command: ''                # auto-detected: launchctl/systemctl

# ─── Provider Health (v0.29.0) ──────────────────────────────────
provider_health:
  enabled: true
  check_interval: 60
  primary:
    type: ollama
    url: http://localhost:11434
    model: glm-5.2:cloud
  fallback:
    type: mesh
    url: ''                           # auto-detected from mesh peers

# ─── Learning Loop (v0.29.0) ───────────────────────────────────
learning_loop:
  health_scorer:
    decay_factor: 0.15
    recovery_factor: 0.05
    latency_threshold_ms: 5000
    persist_interval: 60              # PG persistence interval
  diagnostics:
    enabled: true
    interval: 300                     # 5 minutes
    persist_suggestions: true