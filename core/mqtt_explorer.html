<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A2A Mesh — MQTT Explorer</title>
<link rel="icon" type="image/png" href="/branding/favicon_32.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117; --bg2: #161b22; --border: #30363d; --text: #c9d1d9;
  --text2: #8b949e; --accent: #ff8c42; --green: #238636; --blue: #58a6ff;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', monospace; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

/* Header */
#header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
#header h1 { font-size: 15px; color: var(--accent); white-space: nowrap; }
#header .badge { background: var(--border); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
#header .badge.green { background: #23863644; color: var(--green); }
#refresh-btn { background: var(--green); color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
#auto-refresh { font-size: 11px; color: var(--text2); }

/* Main layout */
#main { display: flex; flex: 1; min-height: 0; }

/* Tree Panel */
#tree-panel { width: 320px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; flex-shrink: 0; }
.tree-item { cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 6px; user-select: none; }
.tree-item:hover { background: #30363d44; }
.tree-item.selected { background: var(--accent)22; border-left: 3px solid var(--accent); }
.tree-children { padding-left: 16px; }
.tree-icon { font-size: 14px; width: 16px; text-align: center; }
.tree-count { color: var(--text2); font-size: 10px; margin-left: auto; }

/* Content Area */
#content-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Messages Table */
#messages-panel { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
#messages-panel h3 { color: var(--blue); font-size: 13px; margin-bottom: 8px; }
.msg-row { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 4px 0; font-size: 11px; font-family: monospace; }
.msg-topic { color: var(--accent); font-weight: bold; }
.msg-payload { word-break: break-all; color: var(--text); margin-top: 4px; max-height: 80px; overflow-y: auto; }
.msg-meta { color: var(--text2); font-size: 10px; margin-top: 4px; display: flex; gap: 12px; }

/* Publisher Form */
#publisher { border-top: 1px solid var(--border); background: var(--bg2); padding: 12px; flex-shrink: 0; }
#publisher h4 { color: var(--accent); font-size: 13px; margin-bottom: 8px; }
.pub-row { display: flex; gap: 8px; margin: 4px 0; }
.pub-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; flex: 1; min-width: 0; }
.pub-input:focus { outline: none; border-color: var(--accent); }
.pub-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; font-size: 12px; }
.pub-btn { background: var(--accent); color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
.pub-btn:hover { opacity: 0.85; }
.pub-status { margin-top: 6px; font-size: 11px; color: var(--text2); }

/* Empty state */
.empty { color: var(--text2); font-style: italic; padding: 20px; text-align: center; }

@media (max-width: 768px) {
  #tree-panel { width: 100%; max-height: 45dvh; min-height: 120px; border-right: none; border-bottom: 1px solid var(--border); flex-shrink: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #main { flex-direction: column; }
  #content-area { flex: 1; min-height: 0; }
  #publisher { padding: 8px; }
  #publisher h4 { margin-bottom: 4px; }
  .msg-row { font-size: 10px; padding: 6px; }
  #header { padding: 8px 10px; }
  #header h1 { font-size: 13px; }
  #header .badge { font-size: 10px; }
}
</style>
</head>
<body>
<div id="header">
  <h1>📡 MQTT Explorer</h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <span class="badge green" id="msg-count">0 üzenet</span>
    <button id="refresh-btn" onclick="loadTopics()">⟳ Frissítés</button>
    <label><input type="checkbox" checked onchange="toggleAutoRefresh(this.checked)"> Auto refresh (5s)</label>
  </div>
</div>

<div id="main">
  <div id="tree-panel">
    <div style="color:var(--text2);font-size:11px;margin-bottom:8px;">⚡ Topic Fáfa</div>
    <div id="tree-root"></div>
  </div>
  
  <div id="content-area">
    <div id="messages-panel">
      <div class="empty">Kattintson egy topic-ra a részletekért ↗️</div>
    </div>
    
    <div id="publisher">
      <h4>✏️ Publikálás</h4>
      <div class="pub-row">
        <select id="pub-target" class="pub-select" style="flex:1;" title="Célnode">
          <option value="broadcast">🌐 Broadcast (minden node)</option>
          <option value="nova">⭐ Nova</option>
          <option value="morzsa">🐍 Morzsa</option>
          <option value="runa">🏃 Runa</option>
          <option value="tor">🧲 Tor</option>
          <option value="mano">✋ Mano</option>
        </select>
        <input type="text" id="pub-topic" class="pub-input" placeholder="Topic (pl. a2a/sys/test)" />
      </div>
      <textarea id="pub-payload" class="pub-input" rows="2" placeholder='{"payload": "hello world"}' style="margin: 4px 0;"></textarea>
      <div class="pub-row" style="justify-content:space-between;">
        <select id="pub-qos" class="pub-select">
          <option value="0">QoS 0 (at most once)</option>
          <option value="1" selected>QoS 1 (at least once)</option>
          <option value="2">QoS 2 (exactly once)</option>
        </select>
        <label style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;">
          <input type="checkbox" id="pub-retain"> Retain
        </label>
        <button class="pub-btn" onclick="publishMessage()">➤ Publikál</button>
      </div>
      <div id="pub-status" class="pub-status"></div>
    </div>
  </div>
</div>

<script>
// ── State ──
let allTopics = {};
let messageCount = 0;
let selectedTopic = null;
let autoRefresh = true;
let refreshTimer = null;
// Kibontott fa-ágak állapota (group-path Set) — auto-refreshnél is megmarad,
// így a 5s-enkénti renderTree nem csinálja újra a teljes kibontást.
let expandedGroups = new Set();
// Scroll-pozíciók megőrzése frissítéskor
let treeScrollPos = 0;
let panelScrollPos = 0;

// ── Auth ──
function getToken() { return localStorage.getItem('mesh_token') || ''; }

// ── Load topics from API ──
async function loadTopics() {
  try {
    const resp = await fetch('/api/mqtt/topics', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (resp.status === 401) { alert('Auth szükséges'); return; }
    const data = await resp.json();
    allTopics = data.topics || {};
    messageCount = data.total_messages || 0;
    document.getElementById('msg-count').textContent = `${messageCount} üzenet`;
    renderTree();
    if (selectedTopic) {
      // A részletek-panel ne ugorjon a tetejére frissítéskor — a scroll
      // pozíciót megőrizzük (kivéve explicit új topic-választásnál)
      const panel = document.getElementById('messages-panel');
      panelScrollPos = panel.scrollTop;
      showTopicDetails(selectedTopic, true);
      panel.scrollTop = panelScrollPos;
    }
  } catch (e) {
    document.getElementById('messages-panel').innerHTML = `<div class="empty">❌ Hiba: ${e.message}</div>`;
  }
}

// ── Render Tree ──
function renderTree() {
  const root = document.getElementById('tree-root');
  // Scroll-pozíció megőrzése a re-render után (auto-refreshnél ne ugorjon)
  const treePanel = document.getElementById('tree-panel');
  treeScrollPos = treePanel.scrollTop;
  let html = '<div class="tree-item selected" onclick="selectAllTopics()"><span class="tree-icon">🌐</span> összes';
  html += `<span class="tree-count">${messageCount}</span></div>`;
  html += '<div class="tree-children">' + buildTree(allTopics, 1, '') + '</div>';
  root.innerHTML = html;
  treePanel.scrollTop = treeScrollPos;
}

function buildTree(data, depth, prefix) {
  // Group keys by first path segment → recursive tree.
  // IMPORTANT: leaf onclick must carry the FULL topic path (prefix + key),
  // otherwise allTopics[topic] lookup fails and the panel shows empty.
  const groups = {};
  const leafTopics = [];
  for (const [key, val] of Object.entries(data)) {
    const parts = key.split('/');
    if (parts.length === 1) {
      leafTopics.push([key, val]);
    } else {
      const rootKey = parts[0];
      if (!groups[rootKey]) groups[rootKey] = {};
      groups[rootKey][parts.slice(1).join('/')] = val;
    }
  }
  let html = '';
  for (const [rootKey, children] of Object.entries(groups).sort()) {
    const childCount = Object.keys(flattenTopics(children)).length;
    const grpPath = prefix ? prefix + '/' + rootKey : rootKey;
    // Kibontás: (1) korábban felnyitott ág (Set — auto-refreshnél megmarad),
    // (2) különben depth<=2 alapértelmezett nyitva
    const expanded = expandedGroups.has(grpPath) || (depth <= 2 && !expandedGroups.has('!' + grpPath));
    html += `<div class="tree-item" onclick="event.stopPropagation();toggleGroup(this,'${grpPath}')">
      <span class="tree-icon">${expanded ? '📂' : '📁'}</span>${rootKey}<span class="tree-count">${childCount}</span>
    </div>`;
    html += `<div class="tree-children" style="display:${expanded ? 'block' : 'none'}">` + buildTree(children, depth + 1, grpPath) + '</div>';
  }
  for (const [key, val] of leafTopics.sort()) {
    const fullPath = prefix ? prefix + '/' + key : key;
    html += `<div class="tree-item" onclick="event.stopPropagation();selectTopic('${fullPath}')">
      <span class="tree-icon">📝</span>${key}<span class="tree-count">${val.count || 0}</span>
    </div>`;
  }
  return html;
}

function flattenTopics(data) {
  // count all leaf topics under a nested group object
  const out = {};
  for (const [key, val] of Object.entries(data)) {
    if (val && val.messages) { out[key] = val; }
    else if (val && typeof val === 'object') { Object.assign(out, flattenTopics(val)); }
  }
  return out;
}

function toggleGroup(el, grpPath) {
  // Signature: toggleGroup(this, 'full/path') — toggle children of a folder node.
  // A kibontás-állapot a expandedGroups Set-be íródik → az auto-refresh
  // (5s-enkénti renderTree) nem csinálja újra a teljes kibontást.
  const nextEl = el.nextElementSibling;
  if (nextEl && nextEl.classList.contains('tree-children')) {
    const hidden = nextEl.style.display === 'none';
    nextEl.style.display = hidden ? 'block' : 'none';
    const icon = el.querySelector('.tree-icon');
    if (icon) icon.textContent = hidden ? '📂' : '📁';
    if (hidden) {
      expandedGroups.add(grpPath);          // kibontva
      expandedGroups.delete('!' + grpPath); // "bezárt" jelölés törlése
    } else {
      expandedGroups.delete(grpPath);
      expandedGroups.add('!' + grpPath);     // explicit bezárás (default-nyitva ágnál is)
    }
  }
}

function selectAllTopics() {
  selectedTopic = '_all';
  // Flatten all messages from all topics
  const all = [];
  for (const [topic, info] of Object.entries(allTopics)) {
    (info.messages || []).forEach(m => all.push(m));
  }
  all.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  showMessagePanel(all);
}

function selectTopic(topic) {
  selectedTopic = topic;
  showTopicDetails(topic);
}

// ── Show Details ──
function showTopicDetails(topic, isRefresh = false) {
  const panel = document.getElementById('messages-panel');
  if (!topic) {
    panel.innerHTML = '<div class="empty">Válasszon topic-t vagy kattintson az „összes"-re ↗️</div>';
    return;
  }
  const savedScroll = isRefresh ? panel.scrollTop : null;

  const msgs = allTopics[topic]?.messages || [];
  if (!msgs.length) {
    panel.innerHTML = `<h3>${topic}</h3><div class="empty">Nincs üzenet ezen a topicon</div>`;
    return;
  }

  let html = `<h3>📨 ${topic} (${msgs.length} üzenet)</h3>`;
  msgs.slice(0, 50).forEach(m => {
    const ts = new Date(m.timestamp * 1000).toLocaleString('hu-HU');
    const payload = typeof m.payload === 'string' ? m.payload : JSON.stringify(m.payload, null, 2);
    html += `<div class="msg-row">
      <span class="msg-topic">${m.sender || '?'}</span> —
      <span class="msg-payload">${escapeHtml(payload)}</span>
      <div class="msg-meta">
        <span>🕒 ${ts}</span>
        <span>QoS ${m.qos || 1}</span>
        ${m.retain ? '<span>📌 retain</span>' : ''}
      </div>
    </div>`;
  });
  panel.innerHTML = html;
  // Auto-refreshnél megtartjuk a scroll pozíciót, explicit választásnál a tetejére
  panel.scrollTop = (savedScroll !== null) ? savedScroll : 0;
}

function showMessagePanel(msgs) {
  const panel = document.getElementById('messages-panel');
  let html = `<h3>📨 Minden üzenet (${msgs?.length||0})</h3>`;
  (msgs||[]).forEach(m => {
    const ts = new Date(m.timestamp * 1000).toLocaleString('hu-HU');
    const payload = typeof m.payload === 'string' ? m.payload : JSON.stringify(m.payload, null, 2);
    html += `<div class="msg-row">
      <span class="msg-topic">${escapeHtml(m.topic || '?')}</span> —
      <span class="msg-payload">${escapeHtml(payload)}</span>
      <div class="msg-meta">
        <span>🕒 ${ts}</span>
        <span>QoS ${m.qos || 1}</span>
        ${m.retain ? '<span>📌 retain</span>' : ''}
      </div>
    </div>`;
  });
  panel.innerHTML = html;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Publish Message ──
async function publishMessage() {
  const statusEl = document.getElementById('pub-status');
  const target = document.getElementById('pub-target').value;
  const topic = document.getElementById('pub-topic').value.trim();
  const payloadText = document.getElementById('pub-payload').value.trim();
  const qos = parseInt(document.getElementById('pub-qos').value);
  const retain = document.getElementById('pub-retain').checked;
  
  if (!topic || !payloadText) {
    statusEl.textContent = '⚠️ Topic és payload kötelező!';
    statusEl.style.color = '#f85149';
    return;
  }
  
  let payload;
  try { payload = JSON.parse(payloadText); }
  catch (e) { payload = payloadText; }
  
  try {
    const resp = await fetch('/api/mqtt/publish', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ target, topic, payload, qos, retain })
    });
    const result = await resp.json();
    if (result.success) {
      statusEl.textContent = `✅ Publikálva → ${topic} @ QoS ${qos}`;
      statusEl.style.color = '#238636';
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
      loadTopics();
    } else {
      statusEl.textContent = `❌ Hibás: ${result.error || 'ismeretlen hiba'}`;
      statusEl.style.color = '#f85149';
    }
  } catch (e) {
    statusEl.textContent = `❌ HTTP hiba: ${e.message}`;
    statusEl.style.color = '#f85149';
  }
}

// ── Auto Refresh ──
function toggleAutoRefresh(enabled) {
  autoRefresh = enabled;
  if (refreshTimer) clearInterval(refreshTimer);
  if (enabled) refreshTimer = setInterval(loadTopics, 5000);
}
toggleAutoRefresh(true);

// ── Initial Load ──
loadTopics();
</script>
</body>
</html>
