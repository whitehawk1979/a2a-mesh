mesh:
  node_name: test-node
  node_id: ''
  transport_priority:
  - p2p
  - pg_notify
  - http
  capabilities:
  - a2a_messaging
  - file_transfer
  - p2p_transport
  - pg_transport
  - health_monitor
  - registry
  - dashboard
  skills:
  - id: mesh_send
    name: Send Message
    description: Send a message to another agent or broadcast to all
    tags:
    - messaging
    - send
  - id: mesh_discover
    name: Discover Agents
    description: List all agents in the mesh and their capabilities
    tags:
    - discovery
    - agents
  - id: mesh_health
    name: Health Check
    description: Get health status and metrics of this agent
    tags:
    - health
    - monitoring
  - id: task_execution
    name: Task Execution
    description: Execute delegated tasks and report results back to the coordinator
    tags:
    - task
    - execution
    - delegation
  webhook_port: 8765
  health_port: 8651
  auth_mode: open
  wake_agent_on_message: true
  transports:
    pg_notify:
      host: 192.168.1.30
      port: 5432
      dbname: agent_memory
      user: nova
      password: nova_agent_2026
      channels:
      - a2a_channel
      - a2a_steer_channel
      - delegation_channel
      - mesh_channel
      - diagnostic_channel
    p2p:
      enabled: true
      listen_host: 0.0.0.0
      listen_port: 8646
      max_connections: 50
      idle_timeout: 120
      tls_enabled: false
    http:
      url: http://192.168.1.8:8651
      health_url: http://192.168.1.8:8651/health
      timeout: 5
      retries: 3
  discovery:
    min_target_peers: 2
    mdns:
      enabled: true
      service: _a2a._tcp
      port: 8646
    static:
      nodes:
      - name: morzsa
        ip: 192.168.1.30
        p2p_port: 8645
        health_port: 8650
        transport: p2p
      - name: nova
        ip: 192.168.1.8
        p2p_port: 8645
        health_port: 8645
        transport: p2p
      - name: runa
        ip: 192.168.1.100
        p2p_port: 8645
        health_port: 8650
        transport: p2p
      - name: tor
        ip: 172.30.33.13
        p2p_port: 8645
        health_port: 8645
        transport: p2p
  log_file: ~/a2a_mesh/logs/test-node.log
