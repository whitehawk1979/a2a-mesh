global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

scrape_configs:
  - job_name: 'a2a-mesh'
    metrics_path: /metrics
    static_configs:
      - targets:
        - 192.168.1.8:8650
        - 192.168.1.30:8650
        - 192.168.1.100:8650
        labels:
          mesh: 'a2a-mesh'