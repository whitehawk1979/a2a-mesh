# Nginx config for Gitea on Runa
# Place: /etc/nginx/sites-available/gitea
# Symlink: /etc/nginx/sites-enabled/gitea
# Reload: sudo nginx -t && sudo systemctl reload nginx
#
# This fixes the X-Forwarded-Proto issue so Gitea knows it's behind HTTPS

server {
    listen 80;
    server_name gitea.local 192.168.1.100;

    # Redirect HTTP to HTTPS (optional, uncomment if TLS cert configured)
    # return 301 https://$host$request_uri;

    # Or proxy directly (if no TLS)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server (if TLS cert configured)
server {
    listen 443 ssl;
    server_name gitea.local 192.168.1.100;

    # TLS certs (adjust paths)
    # ssl_certificate /etc/ssl/certs/gitea.crt;
    # ssl_certificate_key /etc/ssl/private/gitea.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Gitea app.ini settings needed:
# [server]
# PROTOCOL = http
# HTTP_ADDR = 127.0.0.1
# HTTP_PORT = 3001
# ROOT_URL = https://192.168.1.100/
# DISABLE_ROUTER_LOG = false
#
# [security]
# REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.1
